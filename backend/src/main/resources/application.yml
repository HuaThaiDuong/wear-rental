server:
  port: 8080

spring:
  application:
    name: rentwear
  # Máy dev mặc định chạy profile dev (có dữ liệu mẫu). Deploy thì đặt SPRING_PROFILES_ACTIVE=prod.
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  # Mặc định khớp với docker-compose.yml. Muốn đổi thì đặt biến môi trường DB_URL, DB_USERNAME, DB_PASSWORD.
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/rentwear}
    username: ${DB_USERNAME:rentwear}
    password: ${DB_PASSWORD:rentwear}
  jpa:
    # Bảng do Flyway tạo (src/main/resources/db/migration). Hibernate chỉ kiểm tra Entity có khớp bảng không.
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    # Mọi môi trường chỉ chạy cấu trúc bảng. Dữ liệu mẫu (db/seed) được thêm ở application-dev.yml.
    locations: classpath:db/migration

app:
  cors:
    # 5173: Vite/React · 5500: Live Server · 3000: npx serve
    allowed-origins: http://localhost:5173,http://localhost:5500,http://127.0.0.1:5500,http://localhost:3000